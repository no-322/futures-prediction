# Futures Price Prediction — Pipeline Configuration
#
# All tuneable parameters live here. The pipeline reads this file at startup;
# a GUI can write to it and re-run the pipeline to pick up changes.
#
# random_state is always 42 (project rule) and is NOT configurable here —
# it is enforced in code regardless of what this file says.

data:
  path: data/raw/data.csv
  train_size: 0.5        # fraction of rows used for training (time-ordered)

# Rolling walk-forward validation (the iteration metric — see .claude/skills/evaluation).
# Fixed-width calendar windows stepped forward; never hardcoded in code.
walk_forward:
  train_months: 3        # train-block width in calendar months
  test_months: 1         # test-block width in calendar months
  step_months: 1         # window advance; = test_months → non-overlapping test blocks
  purge: 0               # train rows dropped at the boundary (inert for single-bar label)
  embargo: 0             # test rows skipped after the train block (adjacent-boundary guard)

models:
  baseline:
    max_iter: 1000

  rf:
    n_estimators: 500
    max_depth: null        # null → grow until leaves are pure
    min_samples_leaf: 5
    max_features: sqrt
    oob_score: true
    bootstrap: true
    class_weight: balanced
    n_jobs: -1

  gbm:
    n_estimators: 500
    learning_rate: 0.05    # shrinkage (ESL 10.12.1)
    max_depth: 4           # weak learners (ESL 10.11)
    subsample: 0.8         # stochastic GBM (ESL 10.12.2)
    colsample_bytree: 0.8
    reg_lambda: 1.0
    min_child_weight: 1
    objective: binary:logistic
    eval_metric: logloss
    n_jobs: -1

  svm:
    kernel: rbf            # Gaussian kernel (ESL 12.3.1)
    C: 1.0                 # margin/error trade-off (ESL 12.2.1)
    gamma: scale           # bandwidth adapted to feature variance (ESL 12.3.2)
    class_weight: balanced
    probability: false
    cache_size: 500
